name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LEFTHOOK: '0'
  TEST_DATABASE_URL: postgresql://budget:budget@localhost:5432/family_budget_test

jobs:
  # Job names below are required status checks (branch protection): do not rename.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: family_budget_test
        options: >-
          --health-cmd "pg_isready -U budget -d family_budget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Fetch origin/master (tasks:check id collision rule)
        run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master
      - uses: ./.github/actions/setup
      - name: pnpm verify
        run: pnpm verify

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: pnpm api:contract
        run: pnpm api:contract

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: family_budget_test
        options: >-
          --health-cmd "pg_isready -U budget -d family_budget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Get Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @family-budget/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium with system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @family-budget/e2e exec playwright install --with-deps chromium
      - name: Install system deps only (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @family-budget/e2e exec playwright install-deps chromium

      - name: pnpm e2e:smoke
        run: pnpm e2e:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
          if-no-files-found: ignore
