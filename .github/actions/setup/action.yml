name: Setup
description: Node (from .nvmrc), pnpm 9.15.0, pnpm store cache, frozen-lockfile install

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.0

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        LEFTHOOK: '0'
