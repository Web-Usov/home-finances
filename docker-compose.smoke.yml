# Override used by scripts/smoke-compose.sh together with docker-compose.yml and an
# isolated project name: no fixed container names, so it cannot clash with the running
# dev stack (family-budget-db on 5432) or the preview (3100/8100). Host ports come from
# POSTGRES_PORT / API_HOST_PORT / WEB_HOST_PORT, which the script sets to free ports.
services:
  postgres:
    container_name: !reset null
    networks: [default, offline]
  migrate:
    container_name: !reset null
  api:
    container_name: !reset null
    restart: "no"
  web:
    container_name: !reset null
    restart: "no"

  # T-071: the same migrate image/command on a network with NO route to the outside (internal: true) that
  # still reaches postgres. Run by scripts/smoke-compose.sh; fails if migrate needs to download anything.
  migrate-offline:
    extends:
      file: docker-compose.yml
      service: migrate
    profiles: [offline]
    networks: [offline]
    depends_on: !reset {}
    environment:
      COREPACK_ENABLE_NETWORK: "0"

networks:
  offline:
    internal: true
